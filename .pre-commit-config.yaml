# Installed by `make setup`. Local hooks on purpose: gitleaks is pinned by brew and
# scripts/ci-install.sh (F44), ruff by uv.lock, so there is one version of each tool.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner --verbose
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --check --force-exclude
        language: system
        types: [python]
