first_frame_soft_ratio = 0.6        # qa.py:186
first_frame_dark_luma = 45          # 0..255; qa.py:188
read_chars_per_s = 15.0             # text reading speed (Netflix ceiling is 17); render.py:38, qa.py:203
read_min_s = 0.85                   # s; render.py:39, qa.py:203
read_tolerance_s = 0.02             # s; qa.py:204
thumb_w_px = 180                    # frames shrunk before stats, px; qa.py:55
thumb_h_px = 320                    # px; qa.py:55
hsv_bins = [30, 32]                 # hue, saturation histogram bins; qa.py:63
