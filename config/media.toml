cut_after_s = 0.04                  # first frame after a cut; qa.py:154
hook_offset_s = 0.02                # qa.py:180
first_frame_s = 0.03                # qa.py:183,208
last_frame_inset_s = 0.08           # qa.py:208
overview_edge_s = 0.05              # qa.py:193

[qa.sheets]                         # the three review sheets
